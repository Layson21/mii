[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacobi-method-lab"
version = "1.0.0"
description = "Реализация метода Якоби для поиска собственных чисел и векторов симметричной матрицы"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
